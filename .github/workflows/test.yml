name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: Full CLI image reference to test, preferably pinned by digest
        type: string
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create a project
        id: create
        uses: ./
        with:
          image: ${{ inputs.image }}
          args: new sample

      - name: Compile it
        uses: ./
        with:
          image: ${{ steps.create.outputs.image }}
          args: compile sample

      - name: Export it
        uses: ./
        with:
          image: ${{ steps.create.outputs.image }}
          args: export sample

      - name: Render a screenshot
        uses: ./
        with:
          image: ${{ steps.create.outputs.image }}
          args: screenshot sample --out screenshot.png

      - name: Check the outputs
        run: |
          test -n "$(ls -A sample/Output)"
          test -s screenshot.png

      - uses: actions/upload-artifact@v7
        with:
          name: smoke
          path: |
            sample/Output/
            screenshot.png
